listen=YES
listen_port=990
background=NO
local_enable=YES
write_enable=YES
local_root=/srv/ftp
allow_writeable_chroot=YES
chroot_local_user=YES
seccomp_sandbox=NO
pam_service_name=vsftpd
ssl_enable=YES
implicit_ssl=YES
force_local_data_ssl=YES
force_local_logins_ssl=YES
require_ssl_reuse=YES
rsa_cert_file=/etc/ssl/private/vs.pem
pasv_enable=YES
pasv_min_port=31000
pasv_max_port=31099
pasv_address=127.0.0.1
max_clients=0
max_per_ip=0
